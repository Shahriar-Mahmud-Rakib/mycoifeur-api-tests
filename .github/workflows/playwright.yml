name: MyCoifeur API Automated Tests & Live Allure Report

on:
  # Strictly manual run only (Will NOT trigger automatically on push/commit)
  workflow_dispatch:
    inputs:
      test_scope:
        description: 'Select Test Scope / Module to run'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'enterprise'
          - 'cards'
          - 'auth'
          - 'user'
          - 'salon'
          - 'admin'
          - 'guest'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  api-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Run Tests (Selected Scope)
      run: |
        SCOPE="${{ github.event.inputs.test_scope }}"
        echo "Selected Test Scope: $SCOPE"
        
        if [ "$SCOPE" = "enterprise" ]; then
          echo "Running Enterprise Test Suite (Service Objects, AJV Schema, Matrix, DB)..."
          npm run test:enterprise
        elif [ "$SCOPE" = "cards" ]; then
          echo "Running Cards Test Suite..."
          npx playwright test tests/cards.spec.js
        elif [ "$SCOPE" = "auth" ]; then
          echo "Running Auth Test Suite..."
          npm run test:auth
        elif [ "$SCOPE" = "user" ]; then
          echo "Running User Test Suite..."
          npm run test:user
        elif [ "$SCOPE" = "salon" ]; then
          echo "Running Salon Test Suite..."
          npm run test:salon
        elif [ "$SCOPE" = "admin" ]; then
          echo "Running Admin Test Suite..."
          npm run test:admin
        elif [ "$SCOPE" = "guest" ]; then
          echo "Running Guest Test Suite..."
          npm run test:guest
        else
          echo "Running All Playwright Tests..."
          npx playwright test
        fi
      env:
        CI: true
        BASE_URL: ${{ secrets.BASE_URL || 'https://zk2a6jfr01.execute-api.ap-southeast-5.amazonaws.com' }}

    - name: Generate Detailed Allure Report
      if: always()
      run: node scripts/generate-allure.js

    - name: Deploy Live Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages
