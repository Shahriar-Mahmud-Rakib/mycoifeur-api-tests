name: MyCoifeur API E2E Tests

on:
  workflow_dispatch:

jobs:
  api-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install dependencies
      run: npm ci

    - name: Run Playwright tests
      run: npx playwright test
      env:
        # Any environment variables needed for the CI can go here
        # E.g., overriding the DB host if using a separate staging DB
        # DB_HOST: ${{ secrets.DB_HOST }}
        CI: true

    - name: Upload Playwright Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
